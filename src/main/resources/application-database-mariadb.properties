# Configuracao do servidor MariaDB para a distribuicao Community.
opsfactor.datasource.host=${OPSFACTOR_DATASOURCE_HOST:localhost}
opsfactor.datasource.port=${OPSFACTOR_DATASOURCE_PORT:3306}
opsfactor.datasource.database=${OPSFACTOR_DATASOURCE_DATABASE:opsfactor}

spring.datasource.url=jdbc:mariadb://${opsfactor.datasource.host}:${opsfactor.datasource.port}/${opsfactor.datasource.database}?useBulkStmts=true
spring.datasource.username=${OPSFACTOR_DATASOURCE_USERNAME:opsfactor}
spring.datasource.password=${OPSFACTOR_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=com.opsfactor.community.platform.database.hibernate.dialect.PlanningMariaDBDialect
hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.collation=utf8mb4_unicode_ci

# Configuracoes das insercoes em batch
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=1000

# Configuracoes do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update

# cria sessoes para cada request, evitando necessidade de se criar transacoes para acionamento de lazy collections
spring.jpa.open-in-view=true

# Timeouts e pooling de conexoes
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.maximumPoolSize=5

# Debug do Banco de Dados
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
