#Configuracoes do servidor web
server.port = 5000

enforce.https=false
spring.datasource.sqlScriptEncoding=UTF-8
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#spring.datasource.tomcat.connection-properties=useUnicode=true;characterEncoding=utf-8
spring.datasource.tomcat.connection-properties=useUnicode=true;characterEncoding=utf8mb4;connectionCollation=utf8mb4_unicode_ci
spring.datasource.auto-commit=false
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.collation=utf8mb4_unicode_ci

spring.main.allow-circular-references=true

# garante que mensagens de erro levantadas via ResponseStatusException sejam disponibilizadas ao front-end
server.error.include-message=always

# Expoe o endpoint nativo do Spring Actuator em /health-status para readiness publico.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health-status
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Evita que o springdoc/swagger agrupe endpoints automaticamente por nome de controller.
# Tags passam a existir apenas quando forem declaradas explicitamente via anotacao/configuracao.
springdoc.auto-tag-classes=false
# OpenAPI e Swagger pertencem a oferta Pro/Enterprise. O overlay Enterprise
# reativa explicitamente ambas as superficies para o seu executavel web.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/app/api-docs
springdoc.swagger-ui.path=/app/swagger-ui
springdoc.swagger-ui.url=/app/api-docs
springdoc.swagger-ui.config-url=/app/api-docs/swagger-config

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Logging transversal das integracoes genericas de dados.
opsfactor.data-integration.logging.lifecycle-enabled=false
opsfactor.data-integration.logging.request-content-enabled=false
opsfactor.data-integration.logging.ignored-errors-enabled=false
opsfactor.data-integration.logging.request-content-max-chars=200000

# Configuracao do timeout da aplicacao web
spring.mvc.async.request-timeout=900000
server.servlet.session.timeout=360m
