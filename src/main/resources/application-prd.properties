#cookies seguros
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${enforce.https:false}

#Configuracoes do Debug
# Debug da aplicacao.
debug=false
# Debug detalhado web
#logging.level.org.springframework.web=info

# Debug detalhado Spring Security
#logging.level.org.springframework.security=debug

# CONFIGURACOES QUE DEVEM SER ATIVADAS SOMENTE NO CASO DO SERVIDOR TOMCAT DO SPRING BOOT SER ACESSADO
# DIRETAMENTE PELO USUARIO. CASO CONTRARIO, CONFIGURAR NGINX PARA REALIZAR O REDIRECIONAMENTO SSL
# Seguranca SSL: configurar dominio e certificados por variaveis/arquivos externos ao repositorio.
# The format used for the keystore. It could be set to JKS in case it is a JKS file
#server.ssl.key-store-type=PKCS12
# The path to the keystore containing the certificate (ebcert = pasta com links para o diretorio especifico do dominio)
#server.ssl.key-store=/home/webapp/key/keystore.p12
#server.ssl.key-store=/etc/letsencrypt/live/ebcert/keystore.p12
# The alias mapped to the certificate
#server.ssl.key-alias=keyStoreSpringBoot
# Exige conexoes SSL
# security.require-ssl=true DEPRECATED
#server.ssl.enabled = true

