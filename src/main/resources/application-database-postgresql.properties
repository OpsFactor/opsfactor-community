# Configuracao do PostgreSQL para a distribuicao Community portatil.
# O launcher privado injeta os valores em OPSFACTOR_DATASOURCE_*; a configuracao
# tambem pode ser usada pelo perfil local sem instalar um servico Windows.
opsfactor.datasource.host=${OPSFACTOR_DATASOURCE_HOST:localhost}
opsfactor.datasource.port=${OPSFACTOR_DATASOURCE_PORT:5432}
opsfactor.datasource.database=${OPSFACTOR_DATASOURCE_DATABASE:opsfactor}

spring.datasource.url=jdbc:postgresql://${opsfactor.datasource.host}:${opsfactor.datasource.port}/${opsfactor.datasource.database}
spring.datasource.username=${OPSFACTOR_DATASOURCE_USERNAME:opsfactor}
spring.datasource.password=${OPSFACTOR_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=com.opsfactor.community.platform.database.hibernate.dialect.PlanningPostgreSQLDialect
# Preserva as tabelas/colunas históricas com nomes reservados no PostgreSQL,
# especialmente a tabela user, sem renomear o schema da plataforma.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# `columnDefinition` representa um tipo SQL literal (por exemplo, TEXT), e
# portanto nao deve receber a mesma cotacao aplicada a nomes de tabela/coluna.
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# Configuracoes das insercoes em batch
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=1000

# Configuracoes do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update

# Cria sessoes para cada request, evitando necessidade de transacoes para lazy collections.
spring.jpa.open-in-view=true

# Timeouts e pooling de conexoes
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.maximumPoolSize=5

# Debug do Banco de Dados
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
