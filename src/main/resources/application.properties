# Defaults Community ficam em arquivo separado para que o Enterprise possa
# importar e sobrescrever seus proprios defaults sem depender de flags de edicao.
spring.config.import=classpath:application-community-defaults.properties

# PostgreSQL é o padrão publicado. Para operar outro motor, a implantação deve
# substituir deliberadamente o profile `database-postgresql` por sua alternativa
# compatível; o runtime não tenta inferir o motor pela conexão JDBC.
spring.profiles.active=prd,database-postgresql
