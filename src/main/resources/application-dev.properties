# Conecta em SQLite local em memoria com dados pre-populados via data.sql

# PROPRIEDADES PARA TESTES
debug = false
# A URI file: com mode=memory e a forma reconhecida pelo JDBC SQLite para um
# banco efemero compartilhado somente pelas conexoes deste processo.
spring.datasource.url=jdbc:sqlite:file:opsfactor-community-dev?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# Forca carga do data.sql depois da atualizacao do schema JPA no perfil dev.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# O fixture legado integral ainda referencia colunas que nao pertencem ao
# schema Community. O perfil local sobe com o seed minimo e publico abaixo,
# suficiente para autenticar e validar a navegacao sem publicar dados privados.
spring.sql.init.data-locations=classpath:data-community-dev.sql

#Configuracoes do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
# O JDBC SQLite monta uma consulta UNION para toda a metadata quando Hibernate
# usa a estrategia agrupada. O schema Community excede o limite dessa consulta;
# extrair por tabela permite o bootstrap local em memoria sem alterar o schema.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# Funcoes SQL especificas sao registradas automaticamente via Hibernate FunctionContributor

#Configurações do Debug
#Mostra # transações criadas (para medir efetividade do batch)
spring.jpa.properties.hibernate.generate_statistics=false
#Mostra quais queries estão sendo rodadas (para verificar existência N+1)
spring.jpa.show-sql=false
# beautify SQL output
spring.jpa.properties.hibernate.format_sql=false
# comentários explanatórios das queries
spring.jpa.properties.hibernate.use_sql_comments=false

# para permitir que se importem queries quebradas em diversas linhas no data.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor

# obrigatório para testes, para garantir que não seja gerado erro 'failed to lazily initialize a collection of role'
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
