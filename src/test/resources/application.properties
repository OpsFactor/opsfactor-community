# Funcoes SQL especificas sao registradas automaticamente via Hibernate FunctionContributor.

# Configuracoes comuns dos testes Community apos o achatamento Maven.
debug=false
spring.security.basic.enabled=false
map.demand=/demand

# Configuracoes do JPA e Hibernate usadas pelos testes.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
